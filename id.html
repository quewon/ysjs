<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" type="image/png" href="res/logo.png">
    <title>CMSS | ID</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --floor: 20rem;
        }

        .page {
            display: flex;
            height: 100%;
        }

        .left-column {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-column {
            position: relative;
            flex-shrink: 0;

            right: 0;
            width: 55vw;
            border: none;
            border-left: 1.5px solid black;
            
            display: flex;
            flex-direction: column;
            justify-content: end;
            padding-bottom: var(--floor);
        }

        .qr-code, .signature, .outro > img {
            position: absolute;
            bottom: 5rem;
        }
        .qr-code::after {
            position: absolute;
            content: "SNS 공유";
            bottom: -0.7rem;
            left: 50%;
            transform: translate(-50%, 100%);
            white-space: nowrap;
        }
        .qr-code image {
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .outro > img {
            width: 3rem;
            bottom: 5rem;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .left-column .gradient {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: var(--floor);
            background: linear-gradient(to top,
                rgba(247, 247, 247, .5) 15%,
                rgba(215, 215, 215, .5) 61%,
                rgba(140, 140, 140, .5) 120%
            );
            border-top: 1px solid black;
        }

        .boxes {
            font-family: var(--sans-serif);
            font-weight: bold;
            position: absolute;
            bottom: var(--floor);
            left: 50%;
            transform: translate(-50%, 0);
            white-space: nowrap;
        }

        .boxes div {
            width: fit-content;
            padding: .7rem;
            font-size: 1.25rem;
            border: 1px solid black;
        }

        .boxes > div:first-child {
            transform: translate(0, -1.4em);
        }
        .boxes > div:nth-child(2) {
            transform: rotate(15deg) translate(-.5em, -1em);
        }
        .boxes > div:last-child {
            transform: rotate(-5deg) translate(0, -.7em);
        }

        .id-card {
            position: relative;
            width: 90%;
            max-width: 27rem;
            height: fit-content;
            margin: auto;
            margin-bottom: 0;

            --rotate: 0;
            transform: rotateZ(5deg);

            filter: drop-shadow(3px 3px 5px rgba(0, 0, 0, .25));
        }

        .id-card img,
        .card-info {
            max-width: 100%;
            transform: rotateY(calc(1deg * var(--rotate)));
        }

        .card-info {
            position: absolute;
            top: 0;
            left: 0;
            border: 1px solid transparent;
            width: 100%;
            height: 100%;
            font-family: var(--sans-serif);
            font-size: 1vw;
            color: rgb(110, 110, 110);
        }
        .card-info div, .card-info img {
            position: absolute;
            right: 6%;
            border: none;
            transform: none;
        }
        .card-info .name {
            top: 20%;
        }
        .card-info .date {
            top: 30%;
        }
        .card-info .signature {
            width: 20%;
            left: unset;
            right: 0;
            bottom: 14%;
        }
        .card-info .picture {
            width: 38%;
            height: 59%;
            top: 19%;
            left: 5.6%;
            object-fit: cover;
        }

        canvas.brain {
            width: 50%;
            top: 49%;
            position: absolute;
            right: 4%;
            height: 25%
        }

        .center-card .left-column {
            transition: width 5s, opacity 5s, padding-bottom 5s;
            width: 0;
            opacity: 0;
        }
        .center-card .right-column {
            width: 100%;
            transition: border-color 7s, width 5s;
            border-color: transparent;
            padding-bottom: 23rem;
        }
        .logo {
            position: fixed;
        }
        .return-button {
            position: fixed;
            top: 3rem;
            right: 2rem;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }
        .outro h1 {
            white-space: nowrap;
            margin: 0;
            font-weight: normal;
            font-size: 1.25rem;
            position: absolute;
            top: 17%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 5s;
            opacity: 0;
        }
        .center-card h1 {
            opacity: 1;
        }
        .center-card .return-button {
            opacity: 1;
            pointer-events: all;
        }
        .return-button button {
            font-size: 1.25rem;
            opacity: 0;
            font-family: var(--old-computer);
        }
        .center-card .return-button button {
            opacity: 1;
            transition: opacity 5s;
        }

        .qr-code {
            display: block;
            width: 7rem;
            height: 7rem;
            background: black;
            position: absolute;
            bottom: 11rem;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 5s;
        }
        .center-card .qr-code {
            opacity: 1;
        }

        .container {
            height: 100dvh;
            overflow-x: hidden;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .container .page {
            scroll-snap-align: center;
        }

        .archive-label {
            position: absolute;
            top: 3rem;
            text-align: center;
            width: 100%;
            font-size: 1.25rem;
            line-height: 2em;
        }
        .archive-buttons {
            position: absolute;
            top: 12rem;
            left: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .archive-buttons button {
            padding: .4em 2.5em;
            box-shadow: 0 3px 3px rgba(0, 0, 0, .25);
            font-size: 1.1165rem;
        }
        .archive-buttons button.selected {
            background: #597EEE;
            color: white;
        }
        .archive-buttons button:not(.selected):hover {
            background: white;
        }
        .archive-display {
            width: 100%;
            height: 100%;
            position: absolute;
            pointer-events: none;
        }
        .archive-file {
            pointer-events: auto;
            position: absolute;
            display: flex;
            flex-direction: column;
            top: 50%;
            left: 50%;
            gap: 1.2em;
            transform: translate(-50%, -50%);
        }
        .archive-file div {
            cursor: pointer;
            width: 11rem;
            height: 9rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 7px solid rgba(236, 236, 236, .43);
            box-shadow: 1px 4px 4px 1px rgba(0, 0, 0, .25);
        }
        .archive-file div img {
            width: 13rem;
            transform: rotate(3deg);
        }
        .archive-file span {
            cursor: pointer;
            display: block;
            text-align: center;
            width: 100%;
            font-size: 1.066rem;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .5);
        }
        dialog {
            border: none;
            background: transparent;
            width: fit-content;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        dialog img {
            height: 70vh;
            background: white;
        }
        dialog div {
            margin-top: .5rem;
            background: white;
            color: black;
            width: fit-content;
            padding: .5rem;
        }
        
        .share-button {
            display: none;
        }

        @media screen and (max-width: 500px) {
            .right-column {
                width: 100vw;
                padding: 0;
            }
            .left-column {
                --floor: 40dvh;
                position: absolute;
                height: 100dvh;
                border-bottom: 1px solid black;
            }
            .archive-label {
                margin-top: 0;
                padding-left: 6em;
                padding-right: 1.5em;
                box-sizing: border-box;
                word-break: keep-all;
                text-align: right;
            }
            .outro {
                margin-top: 2.5em;
                width: 80vw;
                white-space: wrap;
                word-break: keep-all;
                text-align: center;
                line-height: 1.5;
            }
            .center-card .right-column {
                padding: 40dvh 3em;
            }
            .qr-code {
                display: none;
            }
            .outro h1 {
                width: 80vw;
                word-break: keep-all;
                white-space: wrap;
                margin-top: 2em;
            }
            .boxes {
                transform: translate(-50%, 14%) scale(0.7);
            }
            .outro > img {
                display: none;
            }
            .return-button {
                top: 2rem;
            }
            .id-card {
                top: 2em;
                opacity: 0;
                transition: opacity 3s;
                animation: swing 8s infinite, tilt 5s infinite;
            }
            @keyframes swing {
                0% {
                    rotate: -5deg;
                }
                50% {
                    rotate: 5deg;
                }
                100% {
                    rotate: -5deg;
                }
            }
            @keyframes tilt {
                0% {
                    scale: 0.95 1;
                }
                50% {
                    scale: 1 0.95;
                }
                100% {
                    scale: 0.95 1;
                }
            }
            .center-card .id-card {
                opacity: 1;
            }
            .card-info {
                font-size: 2vw;
            }
            .archive-page {
                display: none;
            }

            .share-button {
                display: block;
                opacity: 0;
                pointer-events: none;
                position: absolute;
                bottom: 6rem;
                left: 50%;
                transform: translate(-50%, 0);
                transition: opacity 5s;
                font-size: inherit;
            }
            .center-card .share-button {
                opacity: 1;
                pointer-events: all;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="page">
            <div class="left-column">
                <div class="gradient"></div>
                <div class="boxes">
                    <div style="background: #080584; color: white; font-size: 2.25rem">축하합니다!</div>
                    <div style="left: 1em; background: white; font-size: 1.75rem"><span class="name"></span>님의</div>
                    <div style="background: #DAD7FE; font-size: 1.75rem">디지털 영생 업로드가 완료되었습니다.</div>
                </div>
            </div>
    
            <div class="right-column">
                <div class="id-card">
                    <img src="res/id_front.png" alt="">
                    <div class="card-info">
                        <div class="name"></div>
                        <div class="date"></div>
                        <img class="picture" src="" alt="">
                        <img class="signature" src="" alt="">
                        <canvas class="brain"></canvas>
                    </div>
                </div>
            </div>

            <div class="outro">
                <h1><u class="name"></u>님의 디지털영생 ID 카드가 완성되었습니다.</h1>
                <a class="return-button" href="index"><button>메인으로 돌아가기 <img class="icon" src="res/arrowright.svg" alt="→"></button></a>
                <a class="logo" href="index"><img src="res/logo.svg"></a>
                <div class="qr-code"></div>
                <img src="res/scroll_prompt.svg">
                <button class="share-button" onclick="share_file()">공유하기</button>
            </div>
        </div>

        <div class="page archive-page">
            <p class="archive-label">
                <u class="name">관람자</u>님의 디지털영생 ID 카드가 <br>
                아카이빙 페이지가 추가 되었습니다.
            </p>
            <div class="archive-buttons">
                <button onclick="select_button()">전체</button>
                <button onclick="select_button(this.textContent)"> </button>
                <button onclick="select_button(this.textContent)"> </button>
                <button onclick="select_button(this.textContent)"> </button>
            </div>
            <div class="archive-display">
            </div>
        </div>

        <footer>
            <span></span>
            <span>(주) 첨단 메모리 시스템</span>
            <span>|</span>
            <span>문의전화 0310-6700-1515</span>
            <span>|</span>
            <span>무료상담</span>
            <span>|</span>
            <span>(주) 첨단 메모리 시스템</span>
            <span></span>
        </footer>
    </div>

    <dialog id="id-dialog">
        <img src="">
        <div>.zip</div>
    </dialog>
    
</body>

<script src="js/qrcode.min.js"></script>
<script>
    var FILE_TO_SHARE;

    async function share_file() {
        
        const data = {
            title: "내 아이디 카드 - (주) 첨단 메모리 시스템",
            files: [FILE_TO_SHARE]
        };
        if (navigator.canShare && navigator.canShare(data)) {
            await navigator.share(data);
        }
    }

    window.devicePixelRatio = 2;

    const archive_buttons = document.querySelector(".archive-buttons");
    const archive_display = document.querySelector(".archive-display");
    const id_dialog = document.getElementById("id-dialog");
    var archived_ids;

    var nameElements = document.getElementsByClassName("name");
    for (let i=0; i<nameElements.length; i++) {
        nameElements[i].textContent = sessionStorage.getItem("name");
    }

    var pictureElements = document.getElementsByClassName("picture");
    for (let i=0; i<pictureElements.length; i++) {
        pictureElements[i].src = sessionStorage.getItem("picture");
    }

    var signatureElements = document.getElementsByClassName("signature");
    for (let i=0; i<signatureElements.length; i++) {
        signatureElements[i].src = sessionStorage.getItem("signature");
        signatureElements[i].style.background = "url(" + sessionStorage.getItem("signature") + ")";
    }

    var id_image = document.querySelector(".id-card > img");
    var bg = new Image();
    bg.src = "res/background.png";
    if (id_image.complete) {
        imageload1();
    } else {
        id_image.addEventListener("load", imageload1);
    }

    function imageload1() {
        if (bg.complete) {
            on_image_load();
        } else {
            bg.addEventListener("load", on_image_load);
        }
    }

    function on_image_load() {
        var brain_canvas = document.querySelector(".brain");
        var brain = JSON.parse(sessionStorage.getItem("brain"));
        var aspect = brain_canvas.clientWidth / brain_canvas.clientHeight;
        brain_canvas.width = 500 * aspect;
        brain_canvas.height = 500;
        var context = brain_canvas.getContext("2d");
        context.font = "100px 'Helvetica'";
        
        var total_particles = 0;
        for (let word in brain) {
            total_particles += brain[word].particles;
        }
        var particle_ratio = brain_canvas.width / total_particles;
        var x = brain_canvas.width;
        for (let word in brain) {
            var radius = Math.min(brain[word].particles/2 * particle_ratio, brain_canvas.height/2);
            radius = Math.max(radius, brain_canvas.height/5);
            x -= radius;

            var y = brain_canvas.height/2;
            y += (Math.random() - .5) * (brain_canvas.height - radius*2);

            context.beginPath();
            context.arc(x, y, radius, 0, Math.PI*2);
            context.fillStyle = brain[word].color;
            context.fill();

            context.textBaseline = "middle";
            context.textAlign = "center";
            context.fillStyle = brain[word].color=="yellow" ? "black" : "white";
            context.fillText(word, x, y);
            x -= radius - (Math.random() * 20);
        }

        var picture = document.querySelector(".picture");
        if (picture.complete) {
            create_share_code();
        } else {
            picture.addEventListener('load', create_share_code)
        }
    };

    var dateElements = document.getElementsByClassName("date");
    for (let i=0; i<dateElements.length; i++) {
        dateElements[i].textContent = get_date();
    }

    var mouse = { x:0, y:0 };
    var id_card = {
        element: document.querySelector(".id-card"),
        tilt: 0,
        flip: 0
    };

    document.addEventListener("mousemove", (e) => {
        mouse.x = e.pageX / window.innerWidth;
        mouse.y = e.pageY / window.innerHeight;

        mouse.x = (mouse.x - .5) * 2;
        mouse.y = (mouse.y - .5) * 2;
    });

    draw();

    function draw() {
        id_card.tilt = lerp(id_card.tilt, mouse.y * 5, .1);
        id_card.flip = lerp(id_card.flip, Math.abs(mouse.x) * 45, .1);

        id_card.element.style.setProperty("--rotate", id_card.flip);
        id_card.element.style.setProperty("transform", "rotateZ(" + id_card.tilt + "deg)");

        requestAnimationFrame(draw);
    }

    function lerp( a, b, alpha ) {
        return a + alpha * ( b - a )
    }

    function create_share_code() {
        var name = sessionStorage.getItem("name");
        var filename = name + " " + get_time() + ".jpg";
        var canvas = draw_id_to_canvas();

        var blob = canvas.toBlob(
            blob => {
                if (window.innerWidth > 500) {
                    var file = new File([blob], filename, { type: "image/jpeg" });
                    var form = new FormData();
                    form.append("image", file);

                    fetch("https://api.imgbb.com/1/upload?key=82c636fb18681ff2a5a24a87d8796833", {
                        method: 'POST',
                        body: form
                    })
                    .then((response) => {
                        response.json()
                        .then((json) => {
                            var url = json.data.url;

                            var qr_element = document.getElementsByClassName("qr-code")[0];
                            var qrcode = new QRCode(qr_element, {
                                width : qr_element.clientWidth,
                                height : qr_element.clientHeight
                            });
                            qrcode.makeCode(url);
                            document.body.classList.add("center-card");

                            archived_ids = localStorage.getItem("id-cards");
                            if (!archived_ids) {
                                archived_ids = [];
                            } else {
                                archived_ids = JSON.parse(archived_ids);
                            }
                            var brain = JSON.parse(sessionStorage.getItem("brain"));
                            for (let keyword in brain) {
                                brain[keyword] = brain[keyword].particles
                            }

                            let id_is_duplicate = false;
                            for (let id of archived_ids) {
                                if (id.image == url) {
                                    id_is_duplicate = true;
                                    break;
                                }
                            }
                            if (!id_is_duplicate) {
                                archived_ids.push({
                                    image: url,
                                    name: name,
                                    brain: brain
                                });
                                localStorage.setItem("id-cards", JSON.stringify(archived_ids));
                            }

                            init_archive();
                        })
                    })
                } else {
                    setTimeout(() => {
                        document.body.classList.add("center-card"); 
                    }, 1000);
                    FILE_TO_SHARE = new File([blob], name + " - (주) 첨단 메모리 시스템.jpg", { type: "image/jpeg" });
                }
            },
            "image/jpeg",
            0.95
        )
    }

    function draw_id_to_canvas() {
        // image width and height
        const width = 800;
        const height = width * (id_image.naturalHeight / id_image.naturalWidth);
        const padding = width/4;

        var canvas = document.createElement("canvas");
        var context = canvas.getContext("2d");
        canvas.width = canvas.height = width + padding;

        var offset_x = padding/2;
        var offset_y = (canvas.height - height) / 2;

        context.translate(offset_x, offset_y);

        context.fillStyle = "white";
        context.fillRect(-offset_x, -offset_y, canvas.width, canvas.height);

        var bg_bounds = { x: -offset_x, y: -offset_y, width: canvas.width, height: canvas.height };
        var bg_scale = 1;
        var bg_offset = { x:0, y:0 };
        bg_scale = Math.max(
            bg_bounds.height / bg.naturalHeight,
            bg_bounds.width / bg.naturalWidth
        );
        bg_offset.x = (bg_bounds.width - (bg.naturalWidth * bg_scale)) / 2;
        bg_offset.y = (bg_bounds.height - (bg.naturalHeight * bg_scale)) / 2;
        context.drawImage(
            bg,
            -bg_offset.x/2, -bg_offset.y/2,
            bg.naturalWidth + bg_offset.x,
            bg.naturalHeight + bg_offset.y,
            bg_bounds.x,
            bg_bounds.y,
            bg_bounds.width,
            bg_bounds.height
        );

        context.shadowColor = "rgba(0, 0, 0, .25)";
        context.shadowBlur = 60;
        context.shadowOffsetX = 10;
        context.shadowOffsetY = 20;
        context.drawImage(
            id_image, 
            0, 0, 
            id_image.naturalWidth, id_image.naturalHeight, 
            0, 0, 
            width, height
        );
        context.shadowColor = "transparent";

        var picture = document.querySelector(".picture");
        var picture_bounds = { x: 5.9/100 * width, y: 19.4/100 * height, width: 38.1/100 * width, height: 60.2/100 * height };
        var picture_scale = 1;
        var picture_offset = { x:0, y:0 };
        picture_scale = Math.max(
            picture_bounds.height / picture.naturalHeight,
            picture_bounds.width / picture.naturalWidth
        );
        picture_offset.x = (picture_bounds.width - (picture.naturalWidth * picture_scale)) / 2;
        picture_offset.y = (picture_bounds.height - (picture.naturalHeight * picture_scale)) / 2;
        context.drawImage(
            picture,
            -picture_offset.x/2, -picture_offset.y/2,
            picture.naturalWidth + picture_offset.x,
            picture.naturalHeight + picture_offset.y,
            picture_bounds.x,
            picture_bounds.y,
            picture_bounds.width,
            picture_bounds.height
        );

        context.font = (width/30)+"px 'Helvetica'";
        context.fillStyle = "rgb(110, 110, 110)";
        context.textAlign = "right";
        context.textBaseline = "middle";
        context.fillText(sessionStorage.getItem("name"), 96.4/100 * width, 23.24/100 * height);
        context.fillText(get_date(), 96.4/100 * width, 33.6/100 * height);

        var brain_canvas = document.querySelector(".brain");
        var brain_bounds = { x: 49.2/100 * width, y: 49.33/100 * height, width: 47.4/100 * width, height: 27.76/100 * height };
        var brain_scale = 1;
        var brain_offset = { x:0, y:0 };
        brain_scale = Math.min(
            brain_bounds.height / brain_canvas.height,
            brain_bounds.width / brain_canvas.width
        );
        brain_offset.x = (brain_bounds.width - (brain_canvas.width * brain_scale)) / 2;
        brain_offset.y = (brain_bounds.height - (brain_canvas.height * brain_scale)) / 2;
        context.drawImage(
            brain_canvas,
            -brain_offset.x/2, -brain_offset.y/2,
            brain_canvas.width + brain_offset.x,
            brain_canvas.height + brain_offset.y,
            brain_bounds.x,
            brain_bounds.y,
            brain_bounds.width,
            brain_bounds.height
        );

        var sign = document.querySelector(".signature");
        var sign_bounds = { x: 83.1/100 * width, y: 78/100 * height, width: 15/100 * width, height: 9.36/100 * height };
        var sign_scale = 1;
        var sign_offset = { x:0, y:0 };
        sign_scale = Math.min(
            sign_bounds.height / sign.naturalHeight,
            sign_bounds.width / sign.naturalWidth
        );
        sign_offset.x = (sign_bounds.width - (sign.naturalWidth * sign_scale)) / 2;
        sign_offset.y = (sign_bounds.height - (sign.naturalHeight * sign_scale)) / 2;
        context.drawImage(
            sign,
            -sign_offset.x/2, -sign_offset.y/2,
            sign.naturalWidth + sign_offset.x,
            sign.naturalHeight + sign_offset.y,
            sign_bounds.x,
            sign_bounds.y,
            sign_bounds.width,
            sign_bounds.height
        );

        return canvas;
    }

    function get_date() {
        var day = new Date().getDate();
        if (day < 10) day = "0"+day;
        return "2024.10." + day;
    }

    function get_time() {
        return new Date().toLocaleTimeString().replace(":","-").replace(":","-");
    }

    // archive

    function init_archive() {
        var all_keywords = {};
        var keyword_count = 0;
        for (let id of archived_ids) {
            for (let keyword in id.brain) {
                if (!all_keywords[keyword]) {
                    all_keywords[keyword] = 0;
                    keyword_count++;
                }
                all_keywords[keyword] += Number(id.brain[keyword]);
            }
        }

        const get_largest_keywords = object => {
            return Object.keys(object).filter(x => {
                return object[x] == Math.max.apply(null, Object.values(object));
            });
        };

        var largest_keywords = get_largest_keywords(all_keywords);
        while (largest_keywords.length < 3 && keyword_count >= 3) {
            for (let keyword of largest_keywords) {
                delete all_keywords[keyword];
            }
            largest_keywords = largest_keywords.concat(get_largest_keywords(all_keywords));
        }

        if (largest_keywords.length > 3) {
            shuffle_array(largest_keywords);
            largest_keywords = largest_keywords.slice(0, 2);
        }

        for (let i=2; i>=0; i--) {
            if (largest_keywords[i]) {
                archive_buttons.children[i+1].textContent = largest_keywords[i];
            } else {
                archive_buttons.children[i+1].remove();
            }
        }
        archive_buttons.children[0].click();
    }

    function shuffle_array(array) {
        let currentIndex = array.length;

        // While there remain elements to shuffle...
        while (currentIndex != 0) {

            // Pick a remaining element...
            let randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;

            // And swap it with the current element.
            [array[currentIndex], array[randomIndex]] = 
                [array[randomIndex], array[currentIndex]];
        }
    }

    function select_button(keyword) {
        while (archive_display.lastElementChild) {
            archive_display.lastElementChild.remove();
        }
        for (let i=0; i<archive_buttons.children.length; i++) {
            let button = archive_buttons.children[i];
            button.classList.remove("selected");
            if (keyword) {
                if (button.textContent == keyword) {
                    button.classList.add("selected");
                }
            } else if (i == 0) {
                button.classList.add("selected");
            }
        }

        var selected_ids = [];

        for (let id of archived_ids) {
            if (keyword) {
                if (id.brain[keyword]) {
                    selected_ids.push(id);
                }
            } else {
                selected_ids.push(id);
            }
        }

        for (let id of selected_ids) {
            create_archive_file(id.name, id.image);
        }
    }

    function create_archive_file(name, url) {
        var file = document.createElement("div");
        file.className = "archive-file";
        file.innerHTML = `<div><img src="${url}"></div><span>${name}.zip</span>`;
        file.style.top = (25 + Math.random() * 55) + "%";
        file.style.left = (30 + Math.random() * 55) + "%";
        file.style.scale = Math.random() * .3 + .7;
        file.querySelector("img").style.transform = "rotate("+ (-15 + Math.random() * 30) +"deg)";
        file.onclick = () => {
            id_dialog.querySelector("img").src = file.querySelector("img").src;
            id_dialog.querySelector("div").textContent = file.querySelector("span").textContent;
            id_dialog.showModal();
        }
        archive_display.appendChild(file);
    }

    document.body.onmouseup = () => { id_dialog.close() };
</script>

</html>
